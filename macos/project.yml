# The macOS app's Xcode project, made by XcodeGen.  libssh and mbedTLS
# (for libdmodemssh) are built first by the repository's CMake, for both
# architectures, into ../build:
#     cmake -S .. -B ../build -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
#         -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 && cmake --build ../build
#     brew install xcodegen && cd macos && xcodegen
#     xcodebuild -project DModem.xcodeproj -scheme DModem build
name: DModem
options:
  bundleIdPrefix: io.github.d-modem
  deploymentTarget:
    macOS: "13.0"
targets:
  DModem:
    type: application
    platform: macOS
    sources:
      - path: DModem
      - path: ../core/src
        buildPhase: sources
      - path: ../ssh/src
        buildPhase: sources
    settings:
      base:
        PRODUCT_NAME: D-Modem
        PRODUCT_BUNDLE_IDENTIFIER: io.github.d-modem.DModem
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include $(SRCROOT)/../ssh/include $(SRCROOT)/../build/dmodem-libssh/include
        GCC_PREPROCESSOR_DEFINITIONS: LIBSSH_STATIC=1
        # libssh and mbedTLS, as CMake built them (see above)
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/dmodem-libssh/lib
        OTHER_LDFLAGS: -lssh -lmbedtls -lmbedx509 -lmbedcrypto -leverest -lp256m
        SWIFT_OBJC_BRIDGING_HEADER: DModem/Bridging.h
        SWIFT_VERSION: "5.0"
        GCC_C_LANGUAGE_STANDARD: c11
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: D-Modem
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright (C) 2026 D-Modem Authors. AGPL-3.0-only.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: D-Modem uses the microphone for voice calls and to record the answering machine's greeting.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        # dmodemd runs as a child process and the modem's pty is opened:
        # no sandbox
        ENABLE_APP_SANDBOX: NO
        # the microphone, for voice calls (the hardened runtime asks for it)
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
    entitlements:
      path: DModem/DModem.entitlements
      properties:
        com.apple.security.device.audio-input: true
